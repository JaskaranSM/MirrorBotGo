services:
  mirrorbot:
    build: .
    # image: ghcr.io/youruser/mirrorbot:latest   # or use a prebuilt image
    container_name: mirrorbot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data             # SQLite DB + state
      - ./downloads:/app/downloads   # scratch download dir
      - ./accounts:/app/accounts     # Google Drive service-account JSONs (USE_SA=true)
      # For OAuth instead of service accounts, mount these and set USE_SA=false:
      # - ./credentials.json:/app/credentials.json
      # - ./token.json:/app/token.json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7870/health"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    # Uncomment to run alongside Postgres:
    # depends_on:
    #   - db

  # Prometheus scrapes the bot's /metrics (mirrorbot:7870) and stores the series.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: mirrorbot-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    depends_on:
      - mirrorbot

  # Grafana, pre-provisioned with the Prometheus datasource and the MirrorBot dashboard.
  grafana:
    image: grafana/grafana:11.2.0
    container_name: mirrorbot-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Optional PostgreSQL backend. To use it, set in .env:
  #   DB_DRIVER=postgres
  #   DB_DSN=postgres://mirrorbot:mirrorbot@db:5432/mirrorbot?sslmode=disable
  # db:
  #   image: postgres:16
  #   container_name: mirrorbot-db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: mirrorbot
  #     POSTGRES_PASSWORD: mirrorbot
  #     POSTGRES_DB: mirrorbot
  #   volumes:
  #     - ./pgdata:/var/lib/postgresql/data

volumes:
  prometheus-data:
  grafana-data:
