# Ephemeral stack for verifying the monitoring setup, exercising the SAME
# mechanism as production: the monitoring config is read from the bot image
# (/app/monitoring) by an init step that seeds a shared volume; prometheus and
# grafana then read it from /cfg. A tiny nginx stub impersonates the bot's
# /metrics endpoint (service "mirrorbot", port 7870) as the scrape target.
#
#   docker compose -f monitoring/verify.compose.yml up -d
#   ... checks ...
#   docker compose -f monitoring/verify.compose.yml down -v
services:
  monitoring-init:
    image: ghcr.io/jaskaransm/mirrorbotgo-rewrite:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["cp -a /app/monitoring/. /cfg/"]
    volumes:
      - mon-config:/cfg
    restart: "no"

  mirrorbot:
    image: nginx:alpine
    container_name: verify-mirrorbot
    volumes:
      - ./nginx-stub.conf:/etc/nginx/conf.d/default.conf:ro
      - ./sample-metrics.txt:/etc/sample-metrics.txt:ro

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: verify-prometheus
    volumes:
      - mon-config:/cfg:ro
    command:
      - --config.file=/cfg/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
      mirrorbot:
        condition: service_started

  grafana:
    image: grafana/grafana:11.2.0
    container_name: verify-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /cfg/grafana/provisioning
    volumes:
      - mon-config:/cfg:ro
    ports:
      - "3000:3000"
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started

volumes:
  mon-config:
