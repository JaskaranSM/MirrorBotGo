services:
  mirrorbot:
    # Builds locally and tags as the ghcr image; or comment out `build` to pull
    # the prebuilt image. monitoring-init reuses this same image for its config.
    build: .
    image: ghcr.io/jaskaransm/mirrorbotgo-rewrite:latest
    container_name: mirrorbot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data             # SQLite DB + state
      - ./downloads:/app/downloads   # scratch download dir
      - ./accounts:/app/accounts     # Google Drive service-account JSONs (USE_SA=true)
      # For OAuth instead of service accounts, mount these and set USE_SA=false:
      # - ./credentials.json:/app/credentials.json
      # - ./token.json:/app/token.json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7870/health"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    # Uncomment to run alongside Postgres:
    # depends_on:
    #   - db

  # One-shot: copy the monitoring config bundled in the bot image into a shared
  # volume so prometheus/grafana can read it. This is how the ./monitoring files
  # "ship with" the mirrorbotgo image instead of being mounted from the host.
  monitoring-init:
    image: ghcr.io/jaskaransm/mirrorbotgo-rewrite:latest
    container_name: mirrorbot-monitoring-init
    entrypoint: ["/bin/sh", "-c"]
    command: ["cp -a /app/monitoring/. /cfg/"]
    volumes:
      - mon-config:/cfg
    restart: "no"

  # Prometheus scrapes the bot's /metrics (mirrorbot:7870) and stores the series.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: mirrorbot-prometheus
    restart: unless-stopped
    volumes:
      - mon-config:/cfg:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/cfg/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
      mirrorbot:
        condition: service_started

  # Grafana, pre-provisioned with the Prometheus datasource and the MirrorBot dashboard.
  grafana:
    image: grafana/grafana:11.2.0
    container_name: mirrorbot-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /cfg/grafana/provisioning
    volumes:
      - mon-config:/cfg:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started

  # Optional PostgreSQL backend. To use it, set in .env:
  #   DB_DRIVER=postgres
  #   DB_DSN=postgres://mirrorbot:mirrorbot@db:5432/mirrorbot?sslmode=disable
  # db:
  #   image: postgres:16
  #   container_name: mirrorbot-db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: mirrorbot
  #     POSTGRES_PASSWORD: mirrorbot
  #     POSTGRES_DB: mirrorbot
  #   volumes:
  #     - ./pgdata:/var/lib/postgresql/data

volumes:
  mon-config:
  prometheus-data:
  grafana-data:
