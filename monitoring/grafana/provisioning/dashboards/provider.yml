apiVersion: 1

providers:
  - name: mirrorbot
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # Dashboards live in the shared config volume mounted at /cfg.
      path: /cfg/grafana/dashboards
      foldersFromFilesStructure: false
